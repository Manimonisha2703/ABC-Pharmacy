name: Build and deploy ASP.Net Core app to Azure Web App - ABC-Pharmacy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore Pharmacy/WebApplication1/WebApplication1.csproj

      - name: Build
        run: dotnet build Pharmacy/WebApplication1/WebApplication1.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Pharmacy/WebApplication1/WebApplication1.csproj --configuration Release --no-build --output "${{ env.DOTNET_ROOT }}/myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BBD6682965AF4053A48D18278CA2CEC8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_80C10512E615480FB55C69E2D65FB62D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F39EAE2674541289A57FEF5AAF189DD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ABC-Pharmacy'
          slot-name: 'Production'
          package: .
